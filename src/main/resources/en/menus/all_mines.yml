id: lastmines:all_mines
provider: lastmines:all_mines
type: chest
size: 54
title: '&8List of mines'

mines_list:
  slots: 10-16,19-25,28-34,37-43
  material: diamond_ore
  name: "&aMine &f{MINE_ID}"
  lore:
    - "&7Blocks: &f%lastmines_blocks_current_count_{MINE_ID}%"
    - "&7Rarities: &f%lastmines_rarities_{MINE_ID}%"
    - ""
    - "&eClick to manage the mine"
  on_click:
    - '[open]'

items:
  info:
    material: diamond_pickaxe
    name: '&bMines'
    lore:
      - '&7Mines are displayed here'
    item_flags:
      - hide_attributes
    slot: 4
    tick_speed: 20
    on_tick: '[update]'

animation:
  - tick: 19
    opcodes:
      - cmd: '[refresh]'
  - tick: 20
    opcodes:
      - goto: 0
