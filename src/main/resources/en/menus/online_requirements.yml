id: lastmines:online_requirements
provider: lastmines:online_requirements
type: chest
size: 54
title: '&8Online requirements &7{MINE_ID}'

items:
  back:
    material: arrow
    name: '&cBack'
    slot: 53
    on_click: '[open] lastmines:main'

  toggle:
    slot: 4
    oneOf:
      - on_view: '{ONLINE_ENABLE} == false'
        material: gray_dye
        name: '&7Requirement disabled'
        lore:
          - '&7The mine always works'
          - '&7Click to enable'
        on_click:
          - '[online_toggle] {MINE_ID}'
      - on_view: '{ONLINE_ENABLE} == true'
        material: lime_dye
        name: '&aRequirement enabled'
        lore:
          - '&7Auto-reset only works if the number'
          - '&7of online players is within range'
          - '&7Click to disable'
        on_click:
          - '[online_toggle] {MINE_ID}'

  min:
    material: red_stained_glass_pane
    name: '&cMin. players: &f{ONLINE_MIN}'
    slot: 11
  minus_min_3:
