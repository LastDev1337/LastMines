id: lastmines:block_drop_item
provider: lastmines:block_drop_item
type: chest
size: 36
title: '&8Drop settings &f{DROP_MATERIAL}'

items:
  back:
    material: arrow
    name: '&cBack'
    slot: 27
    on_click:
      - '[open_drop_items] {MINE_ID} {MATERIAL}'

  info:
    material: '{DROP_MATERIAL}'
    name: '&b{DROP_MATERIAL}'
    lore:
      - '&7Drop chance: &f{CHANCE}%'
      - '&7Fortune affects it: &f{FORTUNE}'
      - ''
      - '&cMMB: &7Remove item from the drop'
    slot: 13
    on_middle_click:
      - '[drop_item_edit] {MINE_ID} {MATERIAL} {DROP_MATERIAL} remove'
      - '[open_drop_items] {MINE_ID} {MATERIAL}'

  fortune_toggle:
    material: nether_star
    name: '&eToggle "fortune affects it"'
    lore:
      - '&7Currently: &f{FORTUNE}'
      - '&7If enabled, the Fortune enchantment'
      - '&7on the pickaxe increases the amount'
    slot: 15
    on_click:
      - '[drop_item_edit] {MINE_ID} {MATERIAL} {DROP_MATERIAL} fortune'

