prefix: '<gradient:#ffcc00:#ff9900>[LastMines]</gradient> &r'

# Системные сообщения
no-permission: '&cУ вас нет прав для выполнения этой команды!'
reloaded: '&aКонфигурация и данные плагина успешно перезагружены!'
gui-not-installed: '&cОшибка: &eBMenu &cне установлен, поэтому GUI интерфейсы недоступны!'
only-players: '&cЭту команду могут выполнять только игроки.'

# Сообщения шахты
mine-reset: '&aАвтошахта &e%mine% &aуспешно обновлена и заполнена новыми блоками!'
mine-not-found: '&cОшибка: Шахта с таким названием не найдена!'
mine-exists: '&cОшибка: Шахта с ID &e%mine% &cуже существует!'
create-success: '&aПоздравляем! Автошахта &e%mine% &aуспешно создана. Используйте &e/lastmines gui %mine% &aдля её настройки.'
select-region: '&cВнимание: &7Сначала выделите регион (с помощью WorldEdit), чтобы создать шахту!'
teleported: '&aУспешно: &7Вы телепортированы на место появления автошахты &e%mine%&7.'
list-empty: '&cНа данный момент нет ни одной созданной или загруженной автошахты.'
list-header: '&aСписок доступных автошахт:'
list-format: ' &8• <gradient:#00ff87:#60efff>%mine%</gradient> &8- &7До обновления: &e%time% сек.'
update-success: '&aШахта &e%mine% &aбыла принудительно обновлена администратором!'

# Редкости
update-next-rarity: '&aСистема: &7Следующая редкость для шахты &e%mine% &7установлена на &f%rarity%&7.'
update-rarity-not-found: '&cОшибка: Редкость &e%rarity% &cне существует, либо эта шахта не использует режим RARITY!'

# Редактирование блоков в чате
chance-exceeded: '&cОшибка: Общий шанс всех блоков не может превышать &e100%&c! Уменьшите шансы других блоков.'
input-chance: '&e▶ &fВведите новый шанс выпадения в чат &7(от 0.0001 до 100)&f.\n&8(У вас есть 1 минута на ввод)'
input-limit: '&e▶ &fВведите новый лимит блоков в чат &7(от 1 до 64)&f.\n&8(У вас есть 1 минута на ввод)'
input-timeout: '&cВремя на ввод значения истекло! Попробуйте снова.'
invalid-number: '&cВведённое значение имеет неверный числовой формат! Используйте только цифры (и точку для дробей).'

# Смена языка (/lastmines language <lang>)
language-usage: '&eИспользование: &f/lastmines language <lang>&e. Доступные: &f%languages%&e. Текущий: &f%current%'
language-invalid: '&cОшибка: язык &e%lang% &cне поддерживается! Доступные: &f%languages%'
language-set: '&aЯзык плагина изменён на &e%lang%&a.'

# Команда помощи
help:
  - '&8<st>                                            </st>'
  - '  <gradient:#ffcc00:#ff9900><b>LastMines</b></gradient> <dark_gray>-</dark_gray> <white>Помощь по командам</white>'
  - ' '
  - ' &8▪ &e/lastmines help &8- &7Показать это сообщение'
  - ' &8▪ &e/lastmines create <id> &8- &7Создать новую автошахту'
  - ' &8▪ &e/lastmines reset <id> &8- &7Принудительно сбросить шахту'
  - ' &8▪ &e/lastmines gui <id> &8- &7Открыть панель управления шахтой'
  - ' &8▪ &e/lastmines list &8- &7Показать список всех автошахт'
  - ' &8▪ &e/lastmines tp <id> &8- &7Телепортироваться к автошахте'
  - ' &8▪ &e/lastmines migrate <plugin> &8- &7Перенести шахты из другого плагина'
  - ' &8▪ &e/lastmines update <id> [rarity] [next] &8- &7Обновить редкость'
  - ' &8▪ &e/lastmines reload &8- &7Перезагрузить плагин и конфиги'
  - ' &8▪ &e/lastmines language <lang> &8- &7Сменить язык плагина'
  - '&8<st>                                            </st>'
