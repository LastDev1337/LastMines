id: lastmines:holograms
provider: lastmines:holograms
type: chest
size: 54
title: '&8Голограммы &7{MINE_ID}'

lines_list:
  slots: 10-16,19-25,28-34,37-43
  name: "&eСтрока #{INDEX}"
  lore:
    - "&7Текст: &f{LINE}"
    - ""
    - "&cНажмите, чтобы удалить"
  on_click: "[holo_edit] {MINE_ID} {INDEX} remove"

items:
  back:
    material: arrow
    name: '&cНазад'
    slot: 53
    on_click: '[open] lastmines:main'

  info:
    material: book
    name: '&dГолограммы'
    lore:
      - '&7Здесь вы можете настраивать голограммы'
      - '&7для автошахты &f{MINE_ID}'
    slot: 3

  settings:
    material: comparator
    name: '&bНастройки голограммы'
    lore:
      - '&7Провайдер, позиция, вкл/выкл'
    slot: 5
    on_click: '[open] lastmines:hologram_settings'

  add_line:
    material: nether_star
    name: '&aДобавить строку'
    lore:
      - '&7Ввести новую строку голограммы в чат'
    slot: 49
    on_click: '[holo_line_add_input] {MINE_ID}'
