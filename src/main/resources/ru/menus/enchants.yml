id: lastmines:enchants
provider: lastmines:enchants
type: chest
size: 54
title: '&8Зачарования кирки &7{MINE_ID}'

items:
  back:
    material: arrow
    name: '&cНазад'
    slot: 53
    on_click: '[open] lastmines:main'

  toggle:
    slot: 3
    oneOf:
      - on_view: '{ENCHANT_ENABLE} == false'
        material: gray_dye
        name: '&7Требования выключены'
        lore:
          - '&7Нажмите, чтобы включить'
        on_click:
          - '[enchant_toggle] {MINE_ID}'
      - on_view: '{ENCHANT_ENABLE} == true'
        material: lime_dye
        name: '&aТребования включены'
        lore:
          - '&7Игрок не сможет ломать блоки'
          - '&7без нужных зачарований на кирке'
          - '&7Нажмите, чтобы выключить'
        on_click:
          - '[enchant_toggle] {MINE_ID}'
  info:
    material: book
    name: '&eДругие зачарования'
    lore:
      - '&7Любое другое зачарование можно'
      - '&7задать вручную в конфиге шахты:'
      - '&fenchant_requirements.enchantments'
      - '&7Сообщение при нехватке зачарований —'
      - '&7в &fenchant_requirements.actions'
    slot: 5

  minus_eff_3:
    material: red_concrete
    slot: 10
    name: '&c-3'
    on_click:
      - '[enchant_edit] {MINE_ID} efficiency -3'
  minus_eff_2:
    material: red_concrete
    slot: 11
    name: '&c-2'
    on_click:
      - '[enchant_edit] {MINE_ID} efficiency -2'
  minus_eff_1:
