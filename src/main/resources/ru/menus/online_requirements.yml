id: lastmines:online_requirements
provider: lastmines:online_requirements
type: chest
size: 54
title: '&8Онлайн-условия &7{MINE_ID}'

items:
  back:
    material: arrow
    name: '&cНазад'
    slot: 53
    on_click: '[open] lastmines:main'

  toggle:
    slot: 4
    oneOf:
      - on_view: '{ONLINE_ENABLE} == false'
        material: gray_dye
        name: '&7Условие выключено'
        lore:
          - '&7Шахта работает всегда'
          - '&7Нажмите, чтобы включить'
        on_click:
          - '[online_toggle] {MINE_ID}'
      - on_view: '{ONLINE_ENABLE} == true'
        material: lime_dye
        name: '&aУсловие включено'
        lore:
          - '&7Автосброс работает, только если'
          - '&7онлайн игроков в диапазоне ниже'
          - '&7Нажмите, чтобы выключить'
        on_click:
          - '[online_toggle] {MINE_ID}'

