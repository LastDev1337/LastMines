name: default
world: world

# Wiki: https://wiki.laststudio.space/lastmines/modes.html
# BLOCKS - принимает только блоки (одна редкость по факту)
# RARITY - принимает несколько редкостей с блоками из конфигурации
mode: BLOCKS

# Wiki: https://wiki.laststudio.space/lastmines/geometry.html
# Если у вас будет стоять WorldEdit или FAWE, то можно будет выделить последние 2 точки и создать шахту
# плагин автоматически создаст шахту с этими точками
positions:
  one: '0;100;0'
  two: '5;105;5'

# Wiki: https://wiki.laststudio.space/lastmines/blocks.html
blocks:
  # Какие есть типы ID (без учёта регистра):
  # minecraft:<ID>, <ID>
  #
  # Soon: eb:<ID>, executableblocks:<ID> (ExecutableBlocks)
  - id: minecraft:stone
    chance: 100.0
    drop:
      # Какие есть типы ID (без учёта регистра):
      # minecraft:<ID>, <ID>
      #
      # Soon: li:<ID>, lastitems:<ID> (LastItems), ei:<ID>, executableitems:<ID> (ExecutableItems), eb:<ID>, executableblocks:<ID> (ExecutableBlocks)
      - 'stone'

# Wiki: https://wiki.laststudio.space/lastmines/actions.html
actions:
  # сообщения в чат
  # [message] [event] <text>
  # сообщения когда до обновления остаётся несколько секунд
  - '[message] [update:15] &fАвтоШахта обновится через 15 секунд'
  - '[message] [update:10] &fАвтоШахта обновится через 10 секунд'
  - '[message] [update:5] &fАвтоШахта обновится через 5 секунд'
  - '[message] [update:3] &fАвтоШахта обновится через 3 секунды'
  - '[message] [update:2] &fАвтоШахта обновится через 2 секунды'
  - '[message] [update:1] &fАвтоШахта обновится через 1 секунду'
  # сообщение когда шахта уже обновилась
  - '[message] [update] &fАвтоШахта обновилась!'
  - '[message] [update] &f \n&fТекущая редкость: %rarity:this%\n&fСледующая редкость: %rarity:next%'
  # звуки
  # [sound] [event plugin] <name> <?volume (default 1.0)> <?pitch (default 1.0)>
  - '[sound] [update:15] ui.button.click 0.8 1'
  - '[sound] [update:10] ui.button.click 0.8 1.0'
  - '[sound] [update:5] ui.button.click 0.8 1.0'
  - '[sound] [update:3] ui.button.click 0.8 1.0'
  - '[sound] [update:2] ui.button.click 0.8 1.0'
  - '[sound] [update:1] ui.button.click 0.8 1.0'
  - '[sound] [update] entity.villager.yes 0.8 0.5'
  # actionbar
  # [actionbar] [event plugin] <time> <update text? (false/true> <text>
  - '[actionbar] [update:15] 1 false &fАвтоШахта обновится через 15 секунд'
  - '[actionbar] [update:10] 1 false &fАвтоШахта обновится через 10 секунд'
  - '[actionbar] [update:5] 1 false &fАвтоШахта обновится через 5 секунд'
  - '[actionbar] [update:3] 1 false &fАвтоШахта обновится через 3 секунды'
  - '[actionbar] [update:2] 1 false &fАвтоШахта обновится через 2 секунды'
  - '[actionbar] [update:1] 1 false &fАвтоШахта обновится через 1 секунду'
  - '[actionbar] [update] 1 false &fАвтоШахта обновилась! Телепортируйся при помощи &6/warp mine'
  # title
  # [title] [event plugin] "<title>\n<subtitle>" <in;stay;keep (default 20;40;20)>
  - '[title] [update:15] "&fАвтоШахта обновится через 15 секунд" 20;45;15'
  - '[title] [update:10] "&fАвтоШахта обновится через 10 секунд" 20;45;15'
  - '[title] [update:5] "&fАвтоШахта обновится через 5 секунд" 20;45;15'
  - '[title] [update:3] "&fАвтоШахта обновится через 3 секунды" 20;45;15'
  - '[title] [update:2] "&fАвтоШахта обновится через 2 секунды" 20;45;15'
  - '[title] [update:1] "&fАвтоШахта обновится через 1 секунду" 20;45;15'
  # здесь будет 20;40;20 т.к. не написано время
  - '[title] [update] "&fАвтоШахта обновилась!\nТелепортируйся при помощи &6/warp mine"'

# Wiki: https://wiki.laststudio.space/lastmines/permissions.html
permissions:
  enable: true
  value: 'lastmines.mine.default'
  messages:
    - '[message] &cУ Вас нет прав на ломание данной шахты!'
    # - message: '&cУ Вас нет прав на ломание данной шахты!'
    # - '&cУ Вас нет прав на ломание данной шахты!'
    #
    # Время может измеряться в секундах (s, sec, second, seconds) или в тиках (t/tick/ticks/ms/millisecond/milliseconds/)
    # false - значит actionbar не будет обновляться (это везде, но тут true вообще не будет работать т.к. ну логики нету пон? ^-^)
    # - '[actionbar] 3s false &cУ Вас нет прав на ломание данной шахты!'
    # - actionbar: '&cУ Вас нет прав на ломание данной шахты!'
    #
    # Если время не написано, то по дефолту будет 20;40;20
    # - '[title] "&6LastMines\n&cУ Вас нету прав!" 20;45;15'
    # - title: '"&6LastMines\n&cУ Вас нету прав!" 20;45;15'

# Wiki: https://wiki.laststudio.space/lastmines/online.html
online:
  enable: true
  min: 1
  max: 1000

# Wiki: https://wiki.laststudio.space/lastmines/teleport.html
teleport:
  enable: true
  # x;y;z;yaw;pitch
  pos: '-1;100.0;-1;0.0;0.0'

# Wiki: https://wiki.laststudio.space/lastmines/holograms.html
hologram:
  enable: true
  # DecentHolograms, FancyHolograms, Vanilla (TextDisplay)
  provider: Vanilla
  offset: '5;106;5' # 'x,y,z' | 'x;y;z'
  # или
  # offset:
  #   x: 5
  #   y: 106
  #   z: 5
  texts:
    - '&6АвтоШахта только с блоками'
    - '&fДо обновления: <gold>%time:detail%</gold>'
    - ''
    - '&fMade with &6LastMines &c<3 &7(laststudio.space)'
