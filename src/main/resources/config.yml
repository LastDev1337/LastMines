# Мультиязычность / Multilingualism
# Поддерживается в 0.2 версии: ru (Русская), en (English)
language: ru

debug:
  enable: false

  level:
    info:
      enable: true
      prefix: '[Debug] '
    warn:
      enable: true
      prefix: '[Debug] '
    error:
      enable: true
      prefix: '[Debug] '

time_load_all_mines: 15s

modules:
  # all: true
  commands: true
  time-format: true
