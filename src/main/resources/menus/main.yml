id: lastmines:main
provider: lastmines:main
type: chest
size: 45
title: '&8Управление шахтой &7{MINE_ID}'

items:
  border:
    material: black_stained_glass_pane
    name: '&r'
    slots: '0-8, 9, 17, 18, 26, 27, 35, 36-44'

  info:
    material: map
    name: '&aИнформация о шахте'
    lore:
      - '&7Айди: &f{MINE_ID}'
      - '&7Блоков: &f%lastmines_blocks_{MINE_ID}%'
      - '&7Редкостей: &f%lastmines_rarities_{MINE_ID}%'
    slot: 13

  blocks:
    material: diamond_ore
    name: '&bБлоки шахты'
    lore:
      - '&7Нажмите, чтобы настроить блоки'
    slot: 20
    on_click: '[open] lastmines:blocks'

  rarities:
    material: nether_star
    name: '&eРедкости шахты'
    lore:
      - '&7Нажмите, чтобы настроить редкости'
    slot: 21
    on_click: '[open] lastmines:rarities'

  holograms:
    material: armor_stand
    name: '&dГолограммы'
    lore:
      - '&7Нажмите, чтобы настроить голограммы'
    slot: 22
    on_click: '[open] lastmines:holograms'

  actions:
    material: command_block
    name: '&cДействия'
    lore:
      - '&7Нажмите, чтобы настроить действия'
    slot: 23
    on_click: '[open] lastmines:actions'

  permissions:
    material: written_book
    name: '&6Права доступа'
    lore:
      - '&7Нажмите, чтобы настроить права'
    slot: 24
    on_click: '[open] lastmines:permissions'

  teleport:
    material: ender_pearl
    name: '&aТелепорт на шахту'
    lore:
      - '&7Нажмите, чтобы телепортироваться'
    slot: 30
    on_click: '[tp_mine] {MINE_ID} %player_name%'

  reset:
    material: bedrock
    name: '&cСбросить шахту'
    lore:
      - '&7Нажмите, чтобы принудительно сбросить'
    slot: 32
    on_click: '[reset_mine] {MINE_ID}'

  close:
    material: barrier
    name: '&cЗакрыть'
    slot: 40
    on_click: '[close]'
